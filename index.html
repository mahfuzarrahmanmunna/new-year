<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="stylex/style.css">

            </div>

    <main class="web-page-width">

                <div class="desc">
                    <h4 class="offer-desc">OUR HOLIDAY DEALS ARE BETTER</h4>
                    <h3 class="offer-pri">ALL CATEGORIES</h3>
                </div>
                <div class="image">
                    <img src="./images/New Year Photo.png" alt="">
                </div>
            </div>
        </section>

        <section class="welcome">
            <div class="writing-section">
                <h2 class="wlc-head merriweather">Welcome to <br> midnight party</h2>
                <p class="primary-desc inter-normal">
                    Dolor sit amet consectetur. Consequat eget consectetur maecenas sed molestie malesuada. 
                    Ipsum sed sodales risus ut pellentesque vel euismod. 
                </p>
                <button class="wlc-btn">Join Now</button>
            </div>
            <div class="image-section">
                <img src="./images/Group 70.png" alt="">
            </div>
        </section>
    </main>
    <footer>

    </footer>
</body>
</html>
